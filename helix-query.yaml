version: 1

indices:
  # Site-wide index of WKND /us/en pages, consumed by the header search
  # typeahead. (nav/footer fragments live at /us/nav and /us/footer, outside
  # /us/en, so they're not included; the indexer only scans HTML pages, not the
  # generated query-index.json, so no excludes are needed.)
  site:
    include:
      - '/us/en/**'
    target: /us/en/query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: |
          attribute(el, 'content')
      description:
        select: head > meta[name="description"]
        value: |
          attribute(el, 'content')
      image:
        select: head > meta[property="og:image"]
        value: |
          attribute(el, 'content')

  # NOTE: the magazine and adventures listings are NOT auto-indexed here.
  # Their query-index.json files (/us/en/magazine/query-index.json and
  # /us/en/adventures/query-index.json) are hand-authored SHEETS in Document
  # Authoring instead — so they can be edited directly in da.live like the FAQ
  # and contributors sheets. If those indexes were auto-generated here, the
  # generator would overwrite the authored sheets whenever a page is published.
  # To add a new magazine article / adventure to a listing, add a row to the
  # corresponding sheet (it will no longer appear automatically on publish).
