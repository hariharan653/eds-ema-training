<meta
  http-equiv="Content-Security-Policy"
  content="script-src 'nonce-aem' 'strict-dynamic' 'unsafe-inline' http: https:; base-uri 'self'; object-src 'none'; frame-src 'self' https:; require-trusted-types-for 'script';"
  move-to-http-header="true"
/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<!-- preconnect to the Google Fonts origins so the non-blocking font load
     (styles/fonts.css via loadFonts) connects fast without blocking render.
     The font stylesheets themselves were moved out of this render-blocking
     <head> into fonts.css (loaded in the lazy phase) — they cost ~1.3s on
     mobile here; the CSS font stacks have system fallbacks + display=swap. -->
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<script nonce="aem" src="/scripts/aem.js" type="module"></script>
<script nonce="aem" src="/scripts/scripts.js" type="module"></script>
<link rel="stylesheet" href="/styles/styles.css"/>
